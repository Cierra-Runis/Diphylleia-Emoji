name: Web fonts

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 2D/fonts/**
      - web_fonts.py
      - npm/**
      - requirements.txt
      - .github/workflows/web-fonts.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release on tags
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install "fonttools[woff]>=4.59.1"

      - name: Build
        env:
          # fontTools writes this into head.modified, keeping builds byte-identical.
          SOURCE_DATE_EPOCH: "0"
        run: |
          python web_fonts.py
          python web_fonts.py --noflags

      - name: Check the committed stylesheets match the fonts
        run: git diff --exit-code -- npm/

      - uses: actions/upload-artifact@v4
        with:
          name: diphylleia-emoji
          path: npm/dist/

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./npm/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already on npm
        id: npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name=$(node -p "require('./npm/package.json').name")
          version=$(node -p "require('./npm/package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage on npm
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm.outputs.published == 'false'
        run: |
          npm install -g npm@latest
          npm stage publish ./npm --access public

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" npm/dist/* --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
